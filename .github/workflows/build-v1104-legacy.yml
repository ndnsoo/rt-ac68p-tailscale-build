name: Build selectable Tailscale for RT-AC68P dual jobs v9

on:
  workflow_dispatch:
    inputs:
      tailscale_ref:
        description: "Tailscale release tag, for example v1.104.4"
        required: true
        default: "v1.104.4"
        type: string
      go_version:
        description: "Go toolchain to use, for example 1.27.3"
        required: true
        default: "1.27.3"
        type: string
      goarm:
        description: "ARM level for RT-AC68P"
        required: true
        default: "7"
        type: choice
        options: ["7", "5"]

permissions:
  contents: read

concurrency:
  group: tailscale-selectable-${{ github.ref }}-${{ inputs.tailscale_ref }}-go${{ inputs.go_version }}
  cancel-in-progress: false

env:
  TAILSCALE_REF: ${{ inputs.tailscale_ref }}
  GO_VERSION: ${{ inputs.go_version }}
  GOOS: linux
  GOARCH: arm
  GOARM: ${{ inputs.goarm }}
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream-router, legacy-runtime]

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Validate manual inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$TAILSCALE_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: tailscale_ref must look like v1.104.4" >&2; exit 1 ;;
          esac
          case "$GO_VERSION" in
            1.[0-9]*|1.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: go_version must look like 1.27.3" >&2; exit 1 ;;
          esac
          case "$GOARM" in 5|7) ;; *) exit 1 ;; esac

      - name: Install selected Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout selected Tailscale source
        uses: actions/checkout@v5
        with:
          repository: tailscale/tailscale
          ref: ${{ env.TAILSCALE_REF }}
          path: tailscale-src
          fetch-depth: 1

      - name: Record source and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics dist out
          {
            echo "Flavor: ${{ matrix.flavor }}"
            echo "Tailscale ref: $TAILSCALE_REF"
            echo "Tailscale commit: $(git -C tailscale-src rev-parse HEAD)"
            echo "Go: $(go version)"
            echo "Target: GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM CGO_ENABLED=$CGO_ENABLED"
            echo "go.mod: $(awk '$1=="go" {print $2; exit}' tailscale-src/go.mod)"
            uname -a
          } | tee diagnostics/environment-${{ matrix.flavor }}.txt
          go version > diagnostics/go-version-${{ matrix.flavor }}.txt

      - name: Verify selected Go satisfies source requirement
        shell: bash
        working-directory: tailscale-src
        run: |
          set -euo pipefail
          REQUIRED_GO=$(awk '$1=="go" {print $2; exit}' go.mod)
          [ -n "$REQUIRED_GO" ] || { echo "ERROR: go directive not found." >&2; exit 1; }
          python3 - "$REQUIRED_GO" "$GO_VERSION" <<'PY'
          import re, sys
          def version(value):
              nums=[int(x) for x in re.findall(r'\d+', value)[:3]]
              return tuple(nums+[0]*(3-len(nums)))
          required=version(sys.argv[1])
          selected=version(sys.argv[2])
          print(f"Source requires Go {sys.argv[1]}; selected Go is {sys.argv[2]}")
          if selected < required:
              raise SystemExit("ERROR: selected Go is older than the source go directive")
          PY

      - name: Download and verify dependencies
        shell: bash
        working-directory: tailscale-src
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Build ARM binaries
        shell: bash
        working-directory: tailscale-src
        run: |
          set -euo pipefail
          BUILD_TAGS=""
          if go list -tags=ts_include_cli ./cmd/tailscale >/dev/null 2>&1; then
            BUILD_TAGS="-tags=ts_include_cli"
          fi
          go build $BUILD_TAGS -trimpath -buildvcs=true -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/tailscale-${{ matrix.flavor }}" ./cmd/tailscale
          go build -trimpath -buildvcs=true -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/tailscaled-${{ matrix.flavor }}" ./cmd/tailscaled

      - name: Verify ELF ARM static binaries
        shell: bash
        run: |
          set -euo pipefail
          for name in tailscale tailscaled; do
            file "dist/$name-${{ matrix.flavor }}" | tee "diagnostics/$name-${{ matrix.flavor }}.file.txt"
            file "dist/$name-${{ matrix.flavor }}" | grep -qi 'ELF 32-bit'
            file "dist/$name-${{ matrix.flavor }}" | grep -qi 'ARM'
            if readelf -l "dist/$name-${{ matrix.flavor }}" | grep -q 'Requesting program interpreter'; then
              echo "ERROR: $name is dynamically linked." >&2
              exit 1
            fi
            go version -m "dist/$name-${{ matrix.flavor }}" \
              | tee "diagnostics/$name-${{ matrix.flavor }}.gomod.txt"
          done

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NO_V="${TAILSCALE_REF#v}"
          PKG="tailscale-${VERSION_NO_V}-go${GO_VERSION}-linux-armv${GOARM}-${{ matrix.flavor }}"
          STAGE="out/$PKG"
          mkdir -p "$STAGE"
          cp "dist/tailscale-${{ matrix.flavor }}" "$STAGE/tailscale"
          cp "dist/tailscaled-${{ matrix.flavor }}" "$STAGE/tailscaled"
          cp diagnostics/environment-${{ matrix.flavor }}.txt "$STAGE/build-info.txt"
          cp diagnostics/*-${{ matrix.flavor }}.*.txt "$STAGE/" 2>/dev/null || true
          (cd "$STAGE" && sha256sum tailscale tailscaled > SHA256SUMS)
          tar -C out -czf "out/$PKG.tar.gz" "$PKG"
          sha256sum "out/$PKG.tar.gz" > "out/$PKG.tar.gz.sha256"

      - name: Build complete Softcenter dual-storage installer
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-softcenter-dual.sh
          scripts/package-softcenter-dual.sh \
            "$GITHUB_WORKSPACE/dist" \
            "${{ matrix.flavor }}" \
            "$GOARM" \
            "$GITHUB_WORKSPACE" \
            "$TAILSCALE_REF" \
            "$GO_VERSION"

      - name: Validate complete Softcenter package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(find out-softcenter -maxdepth 1 -name '*.tar.gz' -type f | head -n1)
          test -n "$PKG"
          rm -rf package-verify && mkdir package-verify
          tar -xzf "$PKG" -C package-verify
          test -x package-verify/tailscale/bin/tailscale
          test -x package-verify/tailscale/bin/tailscaled
          test -f package-verify/tailscale/webs/Module_tailscale.asp
          for f in package-verify/tailscale/install.sh package-verify/tailscale/uninstall.sh package-verify/tailscale/scripts/*.sh; do sh -n "$f"; done
          (cd package-verify/tailscale && sha256sum -c CORE-SHA256SUMS)

      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tailscale-${{ env.TAILSCALE_REF }}-go${{ env.GO_VERSION }}-armv${{ env.GOARM }}-${{ matrix.flavor }}
          path: |
            out/*.tar.gz
            out/*.sha256
            diagnostics/**
            out-softcenter/*.tar.gz
            out-softcenter/*.sha256
          if-no-files-found: error
          retention-days: 90
